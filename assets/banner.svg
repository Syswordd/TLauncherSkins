<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a2f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- Cabeza "default" (gris) -->
  <g transform="translate(110 100)">
    <rect width="160" height="160" rx="10" fill="#475569"/>
    <rect x="30" y="60" width="30" height="20" fill="#e2e8f0"/>
    <rect x="100" y="60" width="30" height="20" fill="#e2e8f0"/>
    <rect x="45" y="60" width="15" height="20" fill="#1e293b"/>
    <rect x="100" y="60" width="15" height="20" fill="#1e293b"/>
    <rect x="55" y="110" width="50" height="14" fill="#334155"/>
    <text x="80" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">antes</text>
  </g>

  <!-- Flecha -->
  <g transform="translate(300 172)" fill="#5eead4">
    <rect x="0" y="4" width="60" height="12" rx="6"/>
    <path d="M56 -8 L80 10 L56 28 Z"/>
  </g>

  <!-- Cabeza con skin (pixel art) -->
  <g transform="translate(410 100)">
    <rect width="160" height="160" rx="10" fill="#7c4a2d"/>
    <rect width="160" height="50" rx="10" fill="#3b2314"/>
    <rect y="40" width="20" height="40" fill="#3b2314"/>
    <rect x="140" y="40" width="20" height="40" fill="#3b2314"/>
    <rect x="20" y="50" width="120" height="110" fill="#e0a87a"/>
    <rect x="35" y="75" width="30" height="20" fill="#ffffff"/>
    <rect x="95" y="75" width="30" height="20" fill="#ffffff"/>
    <rect x="50" y="75" width="15" height="20" fill="#2563eb"/>
    <rect x="95" y="75" width="15" height="20" fill="#2563eb"/>
    <rect x="70" y="105" width="20" height="12" fill="#c2805a"/>
    <rect x="55" y="130" width="50" height="10" fill="#9a4a3a"/>
    <text x="80" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#86efac">después</text>
  </g>

  <text x="640" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#title)">TLauncherSkins</text>
  <text x="642" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Las skins de TLauncher, visibles para todos</text>
  <text x="642" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">Plugin para Paper · funciona con SkinsRestorer</text>
</svg>
