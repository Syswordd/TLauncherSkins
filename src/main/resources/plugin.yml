name: TLauncherSkins
version: ${project.version}
main: es.tlskins.TLauncherSkins
api-version: '1.21'
depend: [SkinsRestorer]
description: Automatically loads TLauncher skins using SkinsRestorer.

commands:
  tlskin:
    description: Reloads a player's TLauncher skin.
    usage: /tlskin [player]

permissions:
  tlskin.use:
    description: Reload your own TLauncher skin.
    default: true
  tlskin.admin:
    description: Reload other players' skins.
    default: op
